<div class="alert-container" *ngIf="alerts.length > 0">
  <div 
    *ngFor="let alert of alerts" 
    class="alert-item"
    [@slideInOut]
    [ngClass]="getAlertClass(alert.type)"
    role="alert"
    aria-live="polite">
    
    <div class="alert-content">
      <div class="alert-icon">
        <i [class]="getAlertIcon(alert.type)" [ngClass]="getAlertIconClass(alert.type)"></i>
      </div>
      
      <div class="alert-body">
        <h6 class="alert-title" *ngIf="alert.title">{{ alert.title }}</h6>
        <p class="alert-message">{{ alert.message }}</p>
        <small class="alert-timestamp">{{ alert.timestamp | date:'shortTime' }}</small>
      </div>
      
      <button 
        *ngIf="alert.dismissible"
        type="button" 
        class="btn-close" 
        (click)="removeAlert(alert.id)"
        aria-label="Cerrar alerta">
        <i class="bi bi-x"></i>
      </button>
    </div>
    
    <!-- Progress bar for auto-dismiss -->
    <div class="alert-progress" *ngIf="alert.duration && alert.duration > 0">
      <div class="progress-bar" [style.animation-duration]="alert.duration + 'ms'"></div>
    </div>
  </div>
</div>
